  <path d="M342 248h18a40 40 0 0 1 0 80h-18" fill="none" stroke="#f59e0b" stroke-width="20" stroke-linecap="round"/>
  <rect x="156" y="352" width="200" height="20" rx="10" fill="#f59e0b"/>

  <!-- vapor -->
  <path d="M216 196c-14-18 14-30 0-50" fill="none" stroke="#67d7ff" stroke-width="14" stroke-linecap="round"/>
  <path d="M256 188c-14-18 14-30 0-50" fill="none" stroke="#67d7ff" stroke-width="14" stroke-linecap="round"/>
  <path d="M296 196c-14-18 14-30 0-50" fill="none" stroke="#67d7ff" stroke-width="14" stroke-linecap="round"/>

  <!-- flechas de sincronización -->
