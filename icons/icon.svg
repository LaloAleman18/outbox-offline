  <path d="M96 132l6-46M96 132l46 2" fill="none" stroke="#67d7ff" stroke-width="18" stroke-linecap="round"/>

  <path d="M416 380a132 132 0 0 1-100 52" fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round"/>
  <path d="M416 380l-6 46M416 380l-46-2" fill="none" stroke="#67d7ff" stroke-width="18" stroke-linecap="round"/>
